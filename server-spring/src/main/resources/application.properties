server.port=${PORT:8080}
spring.main.banner-mode=off

# Web room browse + search (YouTube Data API v3). Leave the key empty to switch them off.
# Set it with the YOUTUBE_API_KEY environment variable (start-party.ps1 does this from party.config.json).
youtube.api-key=${YOUTUBE_API_KEY:}
# Daily budget in YouTube "units". Google's free allowance is 10,000; a search costs 101, browsing costs 1 to 3 per screen.
youtube.daily-units=${YOUTUBE_DAILY_UNITS:9000}
# Country for Trending (two letters, e.g. IN, US, GB)
youtube.region=${YOUTUBE_REGION:IN}
